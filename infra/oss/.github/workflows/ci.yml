name: Reference library
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.23'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
        working-directory: engine
      - run: uv run ruff check && uv run ruff format --check && uv run mypy --strict src && uv run pytest -q
        working-directory: engine
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-web-reader.cjs
      - run: diff -r schema spec/schema && diff -r examples/web spec/examples/web
      - run: uv build --wheel
        working-directory: engine
      - uses: actions/upload-artifact@v4
        with:
          name: nostrobe-wheel
          path: engine/dist/*.whl
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nostrobe-wheel
          path: dist
      - run: cd dist && sha256sum *.whl > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes "Apache-2.0 reference library. Wheel built after the full quality and conformance gates."
        env:
          GH_TOKEN: ${{ github.token }}
