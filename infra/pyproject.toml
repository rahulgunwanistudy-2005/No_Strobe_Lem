[project]
name = "nostrobe-infra"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3==1.42.65", "nostrobe"]

[tool.uv.sources]
nostrobe = {path = "../engine"}

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-boto3[s3]>=1.42,<2"]

[tool.pytest.ini_options]
pythonpath = ["lambda"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
