[project]
name = "nostrobe"
version = "0.1.0"
description = "Offline SDR hazard analysis and portable HazardTrack contracts"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.2,<2.6",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.10,<4",
  "numba>=0.67,<0.68",
]

[project.scripts]
nostrobe = "nostrobe.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.125,<7", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/nostrobe"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
